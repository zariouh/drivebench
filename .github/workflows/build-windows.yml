name: Build Windows Receiver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Temporary Build Artifacts
        run: |
          if (Test-Path "src/DriveBench.Core/obj") { Remove-Item -Recurse -Force "src/DriveBench.Core/obj" }
          if (Test-Path "src/DriveBench.Receiver/obj") { Remove-Item -Recurse -Force "src/DriveBench.Receiver/obj" }
          if (Test-Path "src/DriveBench.Transport/obj") { Remove-Item -Recurse -Force "src/DriveBench.Transport/obj" }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Receiver
        id: build_step
        continue-on-error: true
        run: |
          dotnet publish src/DriveBench.Receiver/DriveBench.Receiver.csproj -c Release -r win-x64 --self-contained true -o ./publish/ 2>&1 | Tee-Object -FilePath build_error.log

      - name: Compress Release ZIP
        if: steps.build_step.outcome == 'success'
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./drivebench-wifi-windows-x64.zip

      - name: Upload Windows Artifact
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: drivebench-windows-x64
          path: ./drivebench-wifi-windows-x64.zip

      - name: Set up Python for Auto-Fix
        if: steps.build_step.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-Fix Windows Build Error with Gemini
        if: steps.build_step.outcome == 'failure'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install google-genai
          cat << 'EOF' > fix_build.py
          import os, glob, json, re, time
          from google import genai

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          error_log = ""
          if os.path.exists("build_error.log"):
              with open("build_error.log", "r", encoding="utf-8", errors="ignore") as f:
                  error_log = f.read()

          code_files = glob.glob('**/*.cs', recursive=True) + glob.glob('**/*.csproj', recursive=True)
          context = ''
          for filepath in code_files:
              if '.github' not in filepath and 'bin' not in filepath and 'obj' not in filepath:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      context += f'\n--- FILE: {filepath} ---\n' + f.read()

          full_prompt = f"""You are an automated C#/.NET build fixing agent.
          The Windows build failed with the following error output:
          
          === BUILD ERROR LOG ===
          {error_log}
          =======================

          Fix all compilation errors in the source code.
          Return ONLY a JSON mapping of updated relative file paths to their complete updated source text.
          Format: {{"path/to/file": "file content..."}}

          Existing Codebase:
          {context}"""

          models_to_try = [
              'gemini-3.8-flash',
              'gemini-3.6-flash',
              'gemini-3.5-flash-lite',
              'gemini-3.1-flash-lite',
              'gemini-3-flash-preview'
          ]

          response = None
          for model_name in models_to_try:
              try:
                  response = client.models.generate_content(model=model_name, contents=full_prompt)
                  if response:
                      break
              except Exception:
                  time.sleep(2)

          if response:
              raw = response.text.strip()
              if raw.startswith('```'):
                  raw = re.sub(r'^```[a-z]*\n|```$', '', raw, flags=re.MULTILINE).strip()
              
              try:
                  files = json.loads(raw)
                  for path, content in files.items():
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                  print("Applied AI auto-fix to Windows codebase.")
              except Exception as e:
                  print(f"Error parsing AI response: {e}")
          EOF
          python fix_build.py

      - name: Commit Auto-Fixes
        if: steps.build_step.outcome == 'failure'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'src/**/*.cs src/**/*.csproj'
          commit_message: "Auto-Fix (Windows): Resolve build compilation error"
