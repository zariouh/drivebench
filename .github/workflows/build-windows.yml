name: Build Windows Receiver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Receiver
        run: |
          dotnet publish src/DriveBench.Receiver/DriveBench.Receiver.csproj -c Release -r win-x64 --self-contained true -o ./publish/

      - name: Compress Release ZIP
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./drivebench-wifi-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drivebench-windows-x64
          path: ./drivebench-wifi-windows-x64.zip
