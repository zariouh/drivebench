name: Build Windows Receiver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Unzip Source If Present
        run: |
          if (Test-Path "source.zip") {
            Expand-Archive -Path "source.zip" -DestinationPath "." -Force
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Receiver
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $proj) { Write-Error "No .csproj file found in repository!"; exit 1 }
          dotnet publish $proj.FullName -c Release -r win-x64 --self-contained true -o ./publish/

      - name: Compress Release ZIP
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./drivebench-wifi-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drivebench-windows-x64
          path: ./drivebench-wifi-windows-x64.zip
