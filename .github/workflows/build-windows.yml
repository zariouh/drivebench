name: Build Windows Receiver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Temporary Build Artifacts
        run: |
          if (Test-Path "src/DriveBench.Core/obj") { Remove-Item -Recurse -Force "src/DriveBench.Core/obj" }
          if (Test-Path "src/DriveBench.Receiver/obj") { Remove-Item -Recurse -Force "src/DriveBench.Receiver/obj" }
          if (Test-Path "src/DriveBench.Transport/obj") { Remove-Item -Recurse -Force "src/DriveBench.Transport/obj" }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Receiver
        id: build_step
        continue-on-error: true
        run: |
          dotnet publish src/DriveBench.Receiver/DriveBench.Receiver.csproj -c Release -r win-x64 --self-contained true -o ./publish/ 2>&1 | Tee-Object -FilePath build_error.log

      - name: Compress Release ZIP
        if: steps.build_step.outcome == 'success'
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./drivebench-wifi-windows-x64.zip

      - name: Upload Windows Artifact
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: drivebench-windows-x64
          path: ./drivebench-wifi-windows-x64.zip

      - name: Set up Python with Cache
        if: steps.build_step.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Gemini SDK
        if: steps.build_step.outcome == 'failure'
        run: pip install -r requirements.txt

      - name: Auto-Fix Windows Build Error with Gemini
        if: steps.build_step.outcome == 'failure'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > fix_build.py
          import os, glob, json, re, time
          from google import genai
          from google.genai import types

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          error_log = ""
          if os.path.exists("build_error.log"):
              with open("build_error.log", "r", encoding="utf-8", errors="ignore") as f:
                  error_log = f.read()

          code_files = glob.glob('**/*.cs', recursive=True) + glob.glob('**/*.csproj', recursive=True)
          context = ''
          for filepath in code_files:
              if '.github' not in filepath and 'bin' not in filepath and 'obj' not in filepath:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      context += f'\n--- FILE: {filepath} ---\n' + f.read()

          full_prompt = f"""You are an automated C#/.NET build fixing agent.
          The Windows build failed with the following error output:
          
          === BUILD ERROR LOG ===
          {error_log}
          =======================

          Fix all compilation errors in the source code (missing namespaces, using directives, System, System.IO, System.Threading.Tasks, System.Threading, System.Linq).
          Return ONLY a valid JSON object mapping updated relative file paths to their complete updated source text.
          Format: {{"path/to/file": "file content..."}}

          Existing Codebase:
          {context}"""

          models_to_try = [
              'gemini-3.8-flash',
              'gemini-flash-latest',
              'gemini-3.6-flash',
              'gemini-3.5-flash-lite',
              'gemini-flash-lite-latest',
              'gemini-3.1-flash-lite',
              'gemini-3-flash-preview'
          ]

          config = types.GenerateContentConfig(
              response_mime_type="application/json"
          )

          response = None
          for model_name in models_to_try:
              try:
                  response = client.models.generate_content(
                      model=model_name,
                      contents=full_prompt,
                      config=config
                  )
                  if response and response.text:
                      break
              except Exception as e:
                  print(f"[{model_name}] Error: {e}")
                  time.sleep(2)

          if response and response.text:
              raw = response.text.strip()
              if raw.startswith('```'):
                  raw = re.sub(r'^```[a-z]*\n|```$', '', raw, flags=re.MULTILINE).strip()
              
              try:
                  # strict=False allows parsing unescaped control characters/newlines inside JSON strings
                  files = json.loads(raw, strict=False)
                  for path, content in files.items():
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                  print("Applied AI auto-fix to Windows codebase.")
              except Exception as e:
                  print(f"Error parsing AI response: {e}\nRaw response:\n{raw}")
          EOF
          python fix_build.py

      - name: Sync Git Remote and Commit Auto-Fixes
        if: steps.build_step.outcome == 'failure'
        shell: bash
        run: |
          # 1. Clean up temporary script and log files
          rm -f build_error.log fix_build.py

          # 2. Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 3. Stage ONLY source code files (.cs and .csproj)
          git add "src/**/*.cs" "src/**/*.csproj"

          # 4. If changes exist, commit, wipe working-tree build clutter, rebase, and push
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-Fix (Windows): Resolve build compilation error"
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin main
            git push origin main
          else
            echo "No C# source code modifications to commit."
          fi
